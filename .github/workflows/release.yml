name: Release All SDKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-sdks:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - name: Blobless clone
        run: |
          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            repo

      - name: Release each SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd repo

          SDKS=$(git ls-tree --name-only HEAD | grep '\.sdk$' | sort -V)
          TOTAL=$(echo "$SDKS" | wc -l)
          COUNT=0

          for sdk in $SDKS; do
            COUNT=$((COUNT + 1))
            TAG="${sdk%.sdk}"
            echo "::group::[$COUNT/$TOTAL] $TAG"

            if gh release view "$TAG" &>/dev/null; then
              echo "exists, skip"
              echo "::endgroup::"
              continue
            fi

            git archive --format=tar HEAD -- "$sdk" | xz -T0 > "${sdk}.tar.xz"

            gh release create "$TAG" \
              "${sdk}.tar.xz" \
              --title "$TAG" \
              --notes "$sdk" \
              --latest=false

            rm -f "${sdk}.tar.xz"
            echo "::endgroup::"
          done
